# Cap per-container log growth so unbounded json-file logs can't fill the
# host disk (see issue #8: one container's log reached 3.1 GB). Applied to
# every service below via `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  searxng:
    image: searxng/searxng:latest
    networks:
      - internal
    logging: *default-logging
    volumes:
      - ./data/searxng:/etc/searxng
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /etc/searxng/settings.yml ]; then
          cat > /etc/searxng/settings.yml <<SETTINGS
        use_default_settings: true
        server:
          secret_key: "$$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
        search:
          formats:
            - json
        SETTINGS
        fi
        exec /usr/local/searxng/.venv/bin/granian searx.webapp:app
    mem_limit: 256m
    restart: unless-stopped

  mcp-web:
    build:
      context: ./packages/mcp-web-py
      dockerfile: Dockerfile
    networks:
      - internal
    environment:
      PORT: 3002
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARXNG_KEY: ${SEARXNG_KEY:-}
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  mcp-rag:
    build:
      context: ./packages/mcp-rag
      dockerfile: Dockerfile
    networks:
      - internal
    environment:
      PORT: 3003
      DATA_DIR: /data/docs
      DB_DIR: /data/chromadb
    volumes:
      - ./rag:/data/docs:ro
      - ./data/mcp-rag/chromadb:/data/chromadb
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  kbbot:
    build:
      context: .
      dockerfile: packages/kbbot/Dockerfile
    networks:
      - internal
    environment:
      NETWORK: ${KBBOT_NETWORK:-testnet2}
      BOT_NAMETAG: ${KBBOT_NAMETAG:-kbbot}
      BOT_MNEMONIC: ${KBBOT_MNEMONIC:-}
      KBBOT_LLM_PROVIDER: ${KBBOT_LLM_PROVIDER:-openai-compatible}
      KBBOT_LLM_API_KEY: ${KBBOT_LLM_API_KEY}
      KBBOT_LLM_MODEL: ${KBBOT_LLM_MODEL:-Gemma-4-31B-it}
      KBBOT_LLM_BASE_URL: ${KBBOT_LLM_BASE_URL:-https://api.arliai.com/v1}
      KBBOT_LLM_TEMPERATURE: ${KBBOT_LLM_TEMPERATURE:-}
      KBBOT_BLOCKLIST: ${KBBOT_BLOCKLIST:-}
      KBBOT_RATE_LIMIT_MAX: ${KBBOT_RATE_LIMIT_MAX:-}
      KBBOT_RATE_LIMIT_WINDOW_SEC: ${KBBOT_RATE_LIMIT_WINDOW_SEC:-}
      MCP_RAG_URL: http://mcp-rag:3003/mcp
      MCP_WEB_URL: http://mcp-web:3002/mcp
      DATA_DIR: /app/data
      TOKENS_DIR: /app/tokens
      MAX_HISTORY_MESSAGES: ${KBBOT_MAX_HISTORY_MESSAGES:-20}
      # No TRUSTBASE_PATH: rely on the SDK's baked-in testnet2 trustbase
      # (networkId 4). The old bundled trustbase-testnet.json was networkId 3.
      AGGREGATOR_KEY: ${AGGREGATOR_KEY:-}
      ORACLE_DEBUG: ${ORACLE_DEBUG:-true}
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data/kbbot/data:/app/data
      - ./data/kbbot/tokens:/app/tokens
    depends_on:
      mcp-rag:
        condition: service_started
      mcp-web:
        condition: service_started
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging

  viktor:
    build:
      context: .
      dockerfile: packages/viktor/Dockerfile
    networks:
      - internal
    environment:
      NETWORK: ${VIKTOR_NETWORK:-testnet2}
      BOT_NAMETAG: ${VIKTOR_NAMETAG:-viktor}
      BOT_MNEMONIC: ${VIKTOR_MNEMONIC:-}
      VIKTOR_LLM_PROVIDER: ${VIKTOR_LLM_PROVIDER:-openai-compatible}
      VIKTOR_LLM_API_KEY: ${VIKTOR_LLM_API_KEY:-}
      VIKTOR_LLM_MODEL: ${VIKTOR_LLM_MODEL:-gpt-oss}
      VIKTOR_LLM_BASE_URL: ${VIKTOR_LLM_BASE_URL:-}
      VIKTOR_LLM_TEMPERATURE: ${VIKTOR_LLM_TEMPERATURE:-}
      AGGREGATOR_KEY: ${AGGREGATOR_KEY:-}
      MCP_RAG_URL: http://mcp-rag:3003/mcp
      MCP_WEB_URL: http://mcp-web:3002/mcp
      DATA_DIR: /app/data
      TOKENS_DIR: /app/tokens
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data/viktor/data:/app/data
      - ./data/viktor/tokens:/app/tokens
    depends_on:
      mcp-rag:
        condition: service_started
      mcp-web:
        condition: service_started
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging

  chess-bot:
    build:
      context: .
      dockerfile: packages/chess-bot/Dockerfile
    networks:
      - internal
    environment:
      NETWORK: ${CHESS_BOT_NETWORK:-testnet2}
      BOT_NAMETAG: ${CHESS_BOT_NAMETAG:-chess-bot}
      BOT_MNEMONIC: ${CHESS_BOT_MNEMONIC:-}
      # wallet-api (chess-bot is the only money-moving bot): aggregator apiKey
      # for the v2 engine + mailbox delivery rail for reward payouts.
      # WALLET_API_URL must be https off-loopback; the bots need outbound HTTPS
      # egress to it. WALLET_API_DEVICE_ID is the stable device label (see the
      # tmpfs note below for why the refresh token isn't actually persisted).
      # WALLET_API_URL must be the wallet-api the PLAYERS' wallets use: a reward
      # deposited on another backend succeeds but is never claimed. The testnet2
      # sphere.unicity.network wallet reads wallet-api.unicity.network; staging
      # has a separate database, and wallet-api.mainnet is real money.
      AGGREGATOR_KEY: ${AGGREGATOR_KEY:-}
      WALLET_API_URL: ${WALLET_API_URL:-https://wallet-api.unicity.network}
      WALLET_API_DEVICE_ID: ${CHESS_BOT_DEVICE_ID:-chess-bot-prod-1}
      MAX_CONCURRENT_GAMES: ${MAX_CONCURRENT_GAMES:-25}
      SHUTDOWN_GRACE_MS: ${CHESS_BOT_SHUTDOWN_GRACE_MS:-60000}
      SHUTDOWN_PAYOUT_WAIT_MS: ${CHESS_BOT_SHUTDOWN_PAYOUT_WAIT_MS:-60000}
      # How often to reconcile open payment intents (CERTIFICATION_UNCONFIRMED /
      # deferred delivery) via resumeNow(). Set 0 to disable.
      RESUME_INTERVAL_MS: ${CHESS_BOT_RESUME_INTERVAL_MS:-300000}
      GROUP_ID: ${CHESS_BOT_GROUP_ID:-chess}
      DATA_DIR: /app/data
      # Payments-v2 journals (open send intents, delivery/mint journals). MUST
      # be a real volume, NEVER tmpfs — see the durability note below.
      JOURNAL_DIR: /app/journal
      TOKENS_DIR: /app/tokens
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data/chess-bot/tokens:/app/tokens
      - ./data/chess-bot/journal:/app/journal
    # /app/data on tmpfs: the SDK's FileStorageProvider does a
    # writeFileSync + fsync + rename of the whole wallet.json on every
    # inbound event (cursor updates, etc.). On EBS, each round-trip is
    # ~5–15 ms and starves the WS reader → publish ACKs balloon to tens
    # of seconds. RAM-backed makes each write microseconds, so the event
    # loop keeps up. wallet.json is rebuilt from BOT_MNEMONIC on every
    # start; handled-game-ids.json is recoverable (cacheMessages:false +
    # dmSince=now+2d + rumor-age filter drop stale challenges).
    #
    # wallet-api note (testnet2): the wallet-api refresh token + inventory
    # cursors also live in /app/data, so tmpfs wipes them on restart. This is an
    # ACCEPTED tradeoff: chess-bot is payout-only and re-funds via self-mint, so
    # it has NO incoming mailbox (no delivery seen-set to lose). A wipe costs
    # only an automatic re-challenge sign-in plus a cheap inventory re-sync from
    # the server (the source of truth) — cheaper than losing the perf win above.
    #
    # DURABILITY CARVE-OUT: that "nothing to lose" argument covers INBOUND state
    # only. OUTBOUND payments-v2 state — the open-intent backstop and delivery
    # journal — also lived here, and losing it silently strands rewards: a send
    # that returns CERTIFICATION_UNCONFIRMED is reported as sent (deliberately,
    # so a retry can't double-pay) and is only finished later by resumeNow().
    # With the journal wiped there was nothing left to resume. Those keys now
    # route to JOURNAL_DIR (a real volume) via createSplitStorageProvider; the
    # hot, re-syncable stream cursor stays here on tmpfs.
    tmpfs:
      - /app/data:size=64m
    # 1 min drain + 1 min payout wait + 30s of buffer for tear-down.
    # Bot calls process.exit(0) on completion, so Docker normally won't
    # need the full window — this is the SIGKILL deadline.
    stop_grace_period: 150s
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging

  unicity-l3:
    build:
      context: .
      dockerfile: packages/unicity-l3/Dockerfile
    networks:
      - internal
    environment:
      NETWORK: ${L3_NETWORK:-testnet2}
      BOT_NAMETAG: ${L3_NAMETAG:-unicity-l3}
      BOT_MNEMONIC: ${L3_MNEMONIC:-}
      AGGREGATOR_KEY: ${AGGREGATOR_KEY:-}
      # testnet2 block-info aggregator (verify this host serves /config/shards +
      # get_block_height/get_block; testnet2 is a fresh chain, heights reset).
      AGGREGATOR_URL: ${L3_AGGREGATOR_URL:-https://gateway.testnet2.unicity.network/}
      EXPLORER_BASE_URL: ${L3_EXPLORER_BASE_URL:-https://unicitynetwork.github.io/smt-explorer/}
      GROUP_ID: ${L3_GROUP_ID}
      POLL_INTERVAL_MS: ${L3_POLL_INTERVAL_MS:-60000}
      SHOW_EMPTY_BLOCKS: ${L3_SHOW_EMPTY_BLOCKS:-false}
      DATA_DIR: /app/data
      TOKENS_DIR: /app/tokens
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - ./data/unicity-l3/data:/app/data
      - ./data/unicity-l3/tokens:/app/tokens
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging

  # Grafana Alloy: container + host metrics → Grafana Cloud Prometheus.
  # Config and credentials are provisioned by sphere-infra/aws/bots/deploy.sh
  # (writes /opt/bots/alloy/config.alloy and /opt/bots/.env.grafana).
  #
  # cAdvisor needs the canonical mounts (/sys/fs/cgroup, /var/lib/docker)
  # to enumerate per-container cgroups; without them only the root cgroup
  # is reported. node-exporter (prometheus.exporter.unix) reads host /proc,
  # /sys and rootfs from the /host/* paths so it doesn't conflict.
  alloy:
    image: grafana/alloy:v1.16.0
    networks:
      - internal
    env_file:
      - .env.grafana
    pid: host
    privileged: true
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

networks:
  internal:
    driver: bridge

